site_name: Pyrception
repo_url: https://github.com/cantordust/pyrception
nav:
  - Overview: index.md
  - API:
      - Modules:
          - Visual:
            - Layers:
                - Receptor: api/visual/layers/receptor.md
                - Horizontal: api/visual/layers/horizontal.md
                - Bipolar: api/visual/layers/bipolar.md
                - Amacrine: api/visual/layers/amacrine.md
                - Ganglion: api/visual/layers/ganglion.md
            - Retina: api/visual/retina.md
            - Receptive fields: api/visual/rf.md
          - Utils: api/visual/utils.md
      - Utils: api/utils.md
      - Configuration:
         - Settings: api/conf/settings.md
         - Components: api/conf/components.md
  - Examples:
      - Image: notebooks/image.ipynb
docs_dir: source
site_dir: site
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: blue grey
      accent: cyan
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: blue grey
      accent: cyan
  features:
    - navigation.footer
    - content.code.select
    - content.code.copy
    - content.tabs.link
  font:
    text: Roboto
    code: Roboto Mono
  locale: en
  highlightjs: true
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            show_source: false
            group_by_category: false
            relative_crossrefs: true
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true
      include_source: true
extra:
  version:
    provider: mike
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
